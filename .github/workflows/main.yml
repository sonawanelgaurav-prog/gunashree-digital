name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: gunashree-digital/apps/mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: gunashree-digital/apps/mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gunashree-digital-apk
          path: gunashree-digital/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
